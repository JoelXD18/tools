const bits=[0,1,2,3,4,5,6].map(r=>{let row=[];[..."RAMOS"].forEach((c,i)=>{if(i)row.push(0);G[c][r].split("").forEach(x=>row.push(x==="1"?1:0))});return row});

const lc=document.getElementById("logo"),lx=lc.getContext("2d");

function sizeLogo(){const dpr=devicePixelRatio||1,cw=Math.min(lc.parentElement.clientWidth,720),p=Math.floor(cw/(W+2));lc._p=p;lc.style.width=p*(W+2)+"px";lc.style.height=p*(7+SH+1)+"px";lc.width=p*(W+2)*dpr;lc.height=p*(7+SH+1)*dpr;lx.setTransform(dpr,0,0,dpr,0,0)}
function drawLogo(t){
  const p=lc._p,g=t<glitchUntil;lx.clearRect(0,0,lc.width,lc.height);lx.fillStyle="#fff";lx.strokeStyle="#fff";lx.lineWidth=Math.max(1,p/7);const sx=((t%4200)/4200)*(W+8)-4;
  for(let y=0;y<7+SH;y++){
    const off=g&&Math.random()<.3?Math.round((Math.random()-.5)*5)*p:0;
    if(g&&Math.random()<.08)continue;
    for(let x=0;x<W;x++){
      if(!bits[y][x])continue;
      const X=(x+1)*p+off,Y=y*p+p/2;
      if(Math.abs(x-sx)<1.6)lx.strokeRect(X+.5,Y+.5,p-1,p-1);else lx.fillRect(X,Y,p,p)
    }
  }
  if(sx>-1&&sx<W+1)lx.fillRect((sx+1)*p+p/2-1,0,2,p*9);
  requestAnimationFrame(drawLogo)
}

/* Lector de metadatos (JPEG/EXIF + XMP) */
function tiff(d,b,L){
  const le=d.getUint16(b)===0x4949,u16=o=>d.getUint16(o,le),u32=o=>d.getUint32(o,le),S=[0,1,1,2,4,8,1,1,2,4,8,4,8];
  const ifd=off=>{const r={},n=u16(b+off);
    for(let i=0;i<n;i++){try{
      const e=b+off+2+i*12,tag=u16(e),t=u16(e+2),c=u32(e+4),z=(S[t]||1)*c,vo=z>4?b+u32(e+8):e+8;let v;
      if(t===2){v="";for(let k=0;k<c-1;k++)v+=String.fromCharCode(d.getUint8(vo+k))}
      else{v=[];for(let k=0;k<Math.min(c,8);k++)v.push(t===3?u16(vo+k*2):t===4?u32(vo+k*4):t===5?u32(vo+k*8)/u32(vo+k*8+4):d.getUint8(vo+k));if(v.length===1)v=v[0]}
      r[tag]=v}catch(x){}}
    return r};
  const a=ifd(u32(b+4)),ex=a[0x8769]?ifd(a[0x8769]):{},g=a[0x8825]?ifd(a[0x8825]):{};
  const P=(k,v,w)=>{if(v!==undefined&&v!==""&&v!==false)L.push((w?"[!] ":"")+k+": "+v)};
  P("camara",[a[0x10F],a[0x110]].filter(Boolean).join(" ").trim());
  P("software",a[0x131],1);P("fecha",a[0x132]);P("fecha original",ex[0x9003],1);
  P("autor",a[0x13B],1);P("copyright",a[0x8298],1);P("descripcion",a[0x10E],1);
  P("propietario",ex[0xA430],1);P("n. serie",ex[0xA431],1);P("objetivo",ex[0xA434]);
  P("iso",ex[0x8827]);P("apertura",ex[0x829D]&&"f/"+ex[0x829D].toFixed(1));
  P("exposicion",ex[0x829A]&&(ex[0x829A]<1?"1/"+Math.round(1/ex[0x829A]):ex[0x829A])+" s");
  P("focal",ex[0x920A]&&ex[0x920A].toFixed(0)+" mm");
  const dm=v=>Array.isArray(v)&&v.length>2?v[0]+v[1]/60+v[2]/3600:null,la=dm(g[2]),lo=dm(g[4]);
  if(la!=null&&lo!=null)P("ubicacion gps",((g[1]==="S"?-1:1)*la).toFixed(5)+", "+((g[3]==="W"?-1:1)*lo).toFixed(5),1);
}
function readMeta(buf){
  const L=[];let jpeg=false,xmp=false;
  try{const d=new DataView(buf);
    if(d.getUint16(0)===0xFFD8){jpeg=true;let o=2;
      while(o+4<d.byteLength&&d.getUint8(o)===0xFF){
        const m=d.getUint8(o+1),n=d.getUint16(o+2);
        if(m===0xE1){const h=d.getUint32(o+4);if(h===0x45786966)tiff(d,o+10,L);else if(h===0x68747470)xmp=true}
        if(m===0xDA)break;o+=2+n}}
  }catch(e){}
  if(xmp)L.push("[!] xmp: presente (datos de edicion / software)");
  return{L,jpeg}
}

/* Utilidades para documentos */
function pdfStr(v){const by=[];
  if(v[0]==="<"){const h=v.replace(/[<>\s]/g,"");for(let i=0;i<h.length;i+=2)by.push(parseInt(h.substr(i,2),16))}
  else v.slice(1,-1).replace(/\\([()\\])|\\n|\\r|([\s\S])/g,(m,a,c)=>{by.push((a||c||" ").charCodeAt(0));return""});
  if(by[0]===254&&by[1]===255){let r="";for(let i=2;i+1<by.length;i+=2)r+=String.fromCharCode(by[i]*256+by[i+1]);return r}
  return by.map(c=>String.fromCharCode(c)).join("")}
async function inflate(raw){const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(raw);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf,want){
  const d=new DataView(buf),u=new Uint8Array(buf),out={};let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--)if(d.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)return out;
  const n=d.getUint16(e+10,true);let o=d.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    const m=d.getUint16(o+10,true),cs=d.getUint32(o+20,true),nl=d.getUint16(o+28,true),el=d.getUint16(o+30,true),cl=d.getUint16(o+32,true),lo=d.getUint32(o+42,true);
    const name=new TextDecoder().decode(u.subarray(o+46,o+46+nl));
    if(want.includes(name)){const st=lo+30+d.getUint16(lo+26,true)+d.getUint16(lo+28,true),raw=u.subarray(st,st+cs);out[name]=m===0?new TextDecoder().decode(raw):await inflate(raw)}
    o+=46+nl+el+cl}
  return out}

/* Video y audio: MP4/MOV/M4A (atomos) y MP3 (ID3) */
const fc=(d,o)=>String.fromCharCode(d.getUint8(o),d.getUint8(o+1),d.getUint8(o+2),d.getUint8(o+3));
const mdate=v=>v?new Date((v-2082844800)*1000).toISOString().replace("T"," ").slice(0,19)+" UTC":"";
function walk(d,s,e,L,K){
  while(s+8<=e){
    let sz=d.getUint32(s);const t=fc(d,s+4);
    if(sz===0||s+sz>e)sz=e-s;if(sz<8)break;
    const a=s+8,z=s+sz;
    if(t==="mvhd"){const v=d.getUint8(a),c=d.getUint32(a+(v?8:4)),ts=d.getUint32(a+(v?20:12)),du=d.getUint32(a+(v?28:16));
      if(c)L.push("creado: "+mdate(c));if(ts)L.push("duracion: "+(du/ts).toFixed(1)+" s")}
    else if(t==="tkhd"){const w=d.getUint32(z-8)/65536,h=d.getUint32(z-4)/65536;if(w>0)L.push("resolucion: "+w+"x"+h)}
    else if(t==="stsd")L.push("codec: "+fc(d,a+12));
    else if(t==="\u00a9xyz"){const m=new TextDecoder().decode(new Uint8Array(d.buffer,a+4,z-a-4)).match(/([+-]\d+\.?\d*)([+-]\d+\.?\d*)/);if(m)L.push("[!] ubicacion gps: "+Number(m[1])+", "+Number(m[2]))}
    else if(t==="keys"){K.length=0;const n=d.getUint32(a+4);let p=a+8;for(let i=0;i<n&&p+8<=z;i++){const k=d.getUint32(p);K.push(new TextDecoder().decode(new Uint8Array(d.buffer,p+8,k-8)));p+=k}}
    else if(t==="ilst"){const M={make:"fabricante",model:"modelo",software:"software","location.ISO6709":"ubicacion gps",creationdate:"fecha local"};let p=a;
      while(p+8<=z){const k=d.getUint32(p),ix=d.getUint32(p+4);if(k<24)break;
        const v=new TextDecoder().decode(new Uint8Array(d.buffer,p+24,k-24)),n=(K[ix-1]||"").replace("com.apple.quicktime.","");
        if(M[n])L.push((n==="creationdate"?"":"[!] ")+M[n]+": "+v);p+=k}}
    else if(t==="meta")walk(d,a+4,z,L,K);
    else if(/^(moov|trak|mdia|minf|stbl|udta)$/.test(t))walk(d,a,z,L,K);
    s=z}}
async function readMp4(file){const L=[];let off=0;
  while(off+8<=file.size){const h=new DataView(await file.slice(off,off+16).arrayBuffer());let sz=h.getUint32(0),hl=8;const t=fc(h,4);
    if(sz===1){sz=h.getUint32(8)*4294967296+h.getUint32(12);hl=16}else if(sz===0)sz=file.size-off;
    if(sz<hl)break;
    if(t==="ftyp")L.push("formato: "+fc(new DataView(await file.slice(off+8,off+12).arrayBuffer()),0).trim());
    if(t==="moov"){if(sz>4e7)break;const buf=await file.slice(off+hl,off+sz).arrayBuffer();walk(new DataView(buf),0,buf.byteLength,L,[]);break}
    off+=sz}
  return L}
async function readId3(file){const L=[],h=new Uint8Array(await file.slice(0,10).arrayBuffer());
  const sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127),v=h[3],u=new Uint8Array(await file.slice(10,10+Math.min(sz,2e6)).arrayBuffer());
  const txt=a=>{const en=a[0];let r=a.subarray(1),lab="latin1";if(en===1){lab=r[0]===254&&r[1]===255?"utf-16be":"utf-16le";r=r.subarray(2)}else if(en===2)lab="utf-16be";else if(en===3)lab="utf-8";return new TextDecoder(lab).decode(r).replace(/\0+/g," ").trim()};
  const N={TIT2:["titulo"],TPE1:["artista",1],TALB:["album"],TYER:["año"],TDRC:["año"],TENC:["codificado por",1],TSSE:["software",1],TCOP:["copyright",1],TOWN:["propietario",1],TPE2:["artista del album",1],COMM:["comentario",1]};
  let p=0;
  while(p+10<=u.length){const id=String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const fs=v===4?((u[p+4]&127)<<21)|((u[p+5]&127)<<14)|((u[p+6]&127)<<7)|(u[p+7]&127):u[p+4]*16777216+(u[p+5]<<16)+(u[p+6]<<8)+u[p+7];
    if(fs<=0)break;const dat=u.subarray(p+10,p+10+fs);
    if(N[id]){const t=id==="COMM"?txt(new Uint8Array([dat[0],...dat.subarray(4)])):txt(dat);if(t)L.push((N[id][1]?"[!] ":"")+N[id][0]+": "+t)}
    p+=10+fs}
  return L}
async function readMedia(file){const h=new Uint8Array(await file.slice(0,12).arrayBuffer()),s4=String.fromCharCode(...h.subarray(4,8));
  if(String.fromCharCode(h[0],h[1],h[2])==="ID3")return{kind:"MP3 (ID3)",L:await readId3(file)};
  if(/^(ftyp|moov|mdat|wide|free|skip)$/.test(s4))return{kind:"MP4 / MOV / M4A",L:await readMp4(file)};
  return null}

/* QR: analisis del contenido */
function qrInfo(d){const L=[],W=t=>L.push("[!] "+t);let clean="",u=null;
  try{u=new URL(d)}catch(e){}
  if(u&&/^https?:$/.test(u.protocol)){
    L.push("tipo: enlace web","dominio: "+u.hostname);
    if(u.protocol==="http:")W("no usa HTTPS (conexion sin cifrar)");
    if(/(^|\.)xn--/.test(u.hostname)||/[^\x00-\x7f]/.test(d))W("el dominio usa caracteres especiales: puede ser una copia falsa de otra web");
    if(/^\d+\.\d+\.\d+\.\d+$/.test(u.hostname))W("va a una IP en vez de a un dominio");
    if(/^(bit\.ly|t\.co|tinyurl\.com|goo\.gl|ow\.ly|is\.gd|cutt\.ly|rb\.gy|shorturl\.at|t\.ly)$/.test(u.hostname))W("enlace acortado: no se ve el destino real");
    if(u.username||u.password)W("lleva usuario@ delante del dominio (truco habitual de engaño)");
    if(u.hostname.split(".").length>4)W("muchos subdominios: puede imitar otra web");
    const tr=[];u.searchParams.forEach((v,k)=>{if(/^(utm_|fbclid|gclid|igshid|mc_eid|mc_cid|msclkid|ttclid|yclid|_hsenc|_hsmi)/i.test(k))tr.push(k)});
    if(tr.length){W("rastreadores en el enlace: "+tr.join(", "));const c=new URL(d);tr.forEach(k=>c.searchParams.delete(k));clean=c.href;L.push("enlace limpio: "+clean)}else clean=u.href;
  }else if(/^WIFI:/i.test(d)){

    L.push("tipo: acceso wifi","red: "+g("S"),"seguridad: "+(g("T")||"abierta"));if(g("P"))W("contiene la contraseña del wifi: "+g("P"))}

function scanFilter(D,W,H,mode){
  if(mode==="co"){for(let i=0;i<D.length;i+=4)for(let c=0;c<3;c++)D[i+c]=Math.max(0,Math.min(255,(D[i+c]-128)*1.3+140));return}

  for(let y=0;y<H;y++){let row=0;for(let x=0;x<W;x++){row+=g[y*W+x];I[(y+1)*(W+1)+x+1]=I[y*(W+1)+x+1]+row}}
  for(let y=0;y<H;y++){const y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);
    for(let x=0;x<W;x++){const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1),n=(x1-x0)*(y1-y0),m=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/n,q=g[y*W+x]/(m+1);
      const v=q>.92?255:q<.72?0:(q-.72)/.2*255,o=(y*W+x)*4;D[o]=D[o+1]=D[o+2]=v}}}
function makePdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const add=x=>{const u=typeof x==="string"?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,body)=>{off[n]=len;add(n+" 0 obj\n"+body+"\nendobj\n")};
  add("%PDF-1.4\n");
  obj(1,"<</Type/Catalog/Pages 2 0 R>>");
  obj(2,"<</Type/Pages/Count "+pages.length+"/Kids["+pages.map((p,i)=>(3+3*i)+" 0 R").join(" ")+"]>>");
  pages.forEach((p,i)=>{
    const id=3+3*i,PW=p.w>p.h?842:595,PH=p.w>p.h?595:842,m=18,sc=Math.min((PW-2*m)/p.w,(PH-2*m)/p.h),iw=(p.w*sc).toFixed(2),ih=(p.h*sc).toFixed(2),x=((PW-iw)/2).toFixed(2),y=((PH-ih)/2).toFixed(2);
    const c="q "+iw+" 0 0 "+ih+" "+x+" "+y+" cm /Im0 Do Q";
    obj(id,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+PW+" "+PH+"]/Resources<</XObject<</Im0 "+(id+2)+" 0 R>>>>/Contents "+(id+1)+" 0 R>>");
    obj(id+1,"<</Length "+c.length+">>\nstream\n"+c+"\nendstream");
    off[id+2]=len;add((id+2)+" 0 obj\n<</Type/XObject/Subtype/Image/Width "+p.w+"/Height "+p.h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+p.b.length+">>\nstream\n");add(p.b);add("\nendstream\nendobj\n")});
  const n=3+3*pages.length,xr=len;add("xref\n0 "+n+"\n0000000000 65535 f \n");
  for(let i=1;i<n;i++)add(String(off[i]).padStart(10,"0")+" 00000 n \n");
  add("trailer\n<</Size "+n+"/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"})}

{n:"bk drink",t:"QR de Burger King (pide codigo)",run(b){

  b.innerHTML='<div id="s1"><p style="margin:0 0 10px">introduce el numero de establecimiento</p><input id="c" type="text" inputmode="numeric" maxlength="12" placeholder="Ej. 99999" autocomplete="off" style="width:100%;box-sizing:border-box;background:#000;color:#fff;border:1px solid #fff;font:inherit;letter-spacing:.2em;padding:8px;outline:0"><div class="acts"><button class="btn" data-a="go">[ generar QR ]</button></div><p id="er" style="color:#777;margin:0"></p></div><div id="s2" style="display:none"><div id="qr" style="background:#fff;display:inline-block;padding:12px;margin:6px 0"></div><div id="tx" style="white-space:pre-wrap;word-break:break-all;color:#777;margin:6px 0"></div><div class="acts"><button class="btn" data-a="re">[ regenerar ]</button><button class="btn" data-a="ch">[ cambiar codigo ]</button></div></div>';
  const q=s=>b.querySelector(s),c=q("#c"),er=q("#er"),s1=q("#s1"),s2=q("#s2"),qr=q("#qr"),tx=q("#tx");
  let code="";
  async function gen(){
    code=c.value.trim();if(!code){er.textContent="hace falta el codigo para generar el QR";c.focus();return}
    er.textContent="generando...";
    try{await lib("https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js","QRCode")}catch(e){er.textContent="no se pudo cargar la libreria de QR";return}

  view.innerHTML=frame(`[${i}] ${t.n.toUpperCase()}`,'<div id="box"></div>')+back("tools");t.run(document.getElementById("box"))}
const go=k=>{if(busy)return;k=String(k);

  if(screen==="menu"){({1:info,2:tools,3:contact})[k]?.()}
  else if(screen==="tools")tool(+k)};
view.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)go(b.dataset.k)});
addEventListener("keydown",e=>{
  if(/^(TEXTAREA|INPUT)$/.test(e.target.tagName)){if(e.key==="Escape")e.target.blur();return}
  if(/^[0-9]$/.test(e.key))go(e.key);else if(e.key==="Escape")go("0")});
